---
teacher: "Phi4"

# Data
datasets:
-
  set: "train"
  name: 'Llama4_DGHD_train.csv'
  split: [0, 0,8]
  shuffle: True
  num_workers: 4

-
  set: "val"
  name: 'Llama4_DGHD_train.csv'
  split: [0.8, 1]
  shuffle: False
  num_workers: 4

-
  set: "test" # Possible to add another test set instead of just splitting
  name: 'Llama4_DGHD_test.csv'
  split: [0, 1]
  shuffle: False
  num_workers: 4

# Model
model:
  name: Llama4Baseline
  n_epochs: 50
  optimizer: "SGD"
  criterion: "BCEWithLogitsLoss"
  use_scheduler: True
  learning_rate: 0.001
  batch_size: 32
  temperature: 2.0
  alpha: 0.3 # Parameter for weighted loss in distilled LF