---
special_training: False

# Data
datasets:
-
  set: "train"
  name: 'Llama4_DGHD_train_mini.csv'
  split: [0, 0.1]
  shuffle: True
  num_workers: 0

-
  set: "val"
  name: 'Llama4_DGHD_train_mini.csv'
  split: [0.1, 1]
  shuffle: False
  num_workers: 0

-
  set: "test1" # Possible to add another test set instead of just splitting
  name: 'Llama4_DGHD_test.csv'
  split: [0, 1]
  shuffle: False
  num_workers: 0

-
  set: "test2" # Possible to add another test set instead of just splitting
  name: 'Llama4_Dataset_1.csv'
  split: [0, 1]
  shuffle: False
  num_workers: 0

# Model
model:
  name: DistilBertDistiller
  n_epochs: 1
  optimizer: "SGD"
  criterion: "BCEWithLogitsLoss"
  use_scheduler: True
  learning_rate: 0.001
  batch_size: 64
  temperature: 1.0
  alpha: # Parameter for weighted loss in distilled LF, if list, sets boundaries for list
    start: 0
    stop: 1
    step: 0.1
  dagger_outer_loops: 3