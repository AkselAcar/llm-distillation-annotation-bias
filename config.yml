---
name: "distilbert"
description: "Train DistilBERT as a student model with Llama-4 Scout as a teacher model"
task: "v1"

# Data
datasets:
-
  set: "train"
  name: 'DGHD.csv'
  split: [0, 0.75]
  shuffle: True
  num_workers: 4

-
  set: "val"
  name: 'DGHD.csv'
  split: [0.75, 1]
  shuffle: False
  num_workers: 4

-
  set: "test" # Possible to add another test set instead of just splitting
  split: [0, 1]
  shuffle: False
  num_workers: 4

# Model
model:
  n_epochs: 10
  optimizer: "SGD"
  use_scheduler: True
  learning_rate: 0.001
  batch_size: 32
  temperature: 2.0
  alpha: 0.5 # Parameter for weighted loss in distilled LF